<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Convite</title>
<meta name="theme-color" content="#0E0B0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Great+Vibes&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/convite.css">
</head>
<body>
<div id="carregando" class="carregando"><span></span></div>

<!-- Senha -->
<section id="tela-senha" class="tela tela-fixa" aria-label="Senha do convite">
  <form class="senha" id="form-senha">
    <span class="senha-icone" id="senha-icone"></span>
    <h1 data-t="senhaTitulo"></h1>
    <p data-t="senhaTexto"></p>
    <input type="password" name="senha" autocomplete="off" required>
    <p class="erro" id="erro-senha" role="alert"></p>
    <button class="btn" type="submit" data-t="entrar"></button>
  </form>
</section>

<!-- Abertura -->
<section id="tela-abertura" class="tela tela-fixa" aria-label="Abertura do convite">
  <div class="palco" data-palco="abertura"><div class="midia-fundo" data-fundo="abertura"></div><div class="camada" data-camada="abertura"></div></div>
  <div class="abertura-conteudo">
    <p class="selo" data-t="convidado"></p>
    <h1 class="nome-script" data-titulo></h1>
    <p class="subtitulo" data-subtitulo></p>
    <button type="button" class="botao-abrir" id="botao-abrir"><span class="pulso" aria-hidden="true"></span><span id="texto-abrir"></span></button>
  </div>
</section>

<!-- Vídeo -->
<section id="tela-video" class="tela tela-fixa preta" aria-label="Vídeo do convite">
  <div class="palco" data-palco="video"><video id="video" playsinline webkit-playsinline preload="auto"></video><div class="camada" data-camada="video"></div></div>
  <button type="button" class="botao-pular" id="botao-pular"></button>
</section>

<!-- Arte (interativo) -->
<section id="tela-arte" class="tela tela-fixa" aria-label="Convite">
  <div class="palco" data-palco="arte"><div class="midia-fundo" data-fundo="arte"></div><div class="camada" data-camada="arte"></div></div>
</section>

<!-- Livrinho -->
<section id="tela-livro" class="tela tela-fixa" aria-label="Livrinho">
  <div class="palco contido" data-palco="livro"><div class="livro" id="livro"></div><div class="camada" data-camada="livro"></div></div>
  <p class="dica" data-t="vireAPagina"></p>
</section>

<!-- Revelação -->
<section id="tela-revelacao" class="tela tela-fixa" aria-label="Raspadinha">
  <div class="palco" data-palco="revelacao"><div class="midia-fundo" data-fundo="revelacao"></div><canvas id="raspadinha"></canvas><div class="camada" data-camada="revelacao"></div></div>
  <p class="dica" id="dica-raspe"></p>
</section>

<!-- Quebra-cabeça -->
<section id="tela-quebra" class="tela tela-fixa" aria-label="Quebra-cabeça">
  <div class="palco contido" data-palco="quebra"><div class="tabuleiro" id="tabuleiro"></div><div class="camada" data-camada="quebra"></div></div>
  <p class="dica" id="dica-quebra" data-t="monte"></p>
</section>

<!-- Convite com as informações -->
<main id="tela-convite" class="tela">
  <header class="hero">
    <div class="palco" data-palco="convite"><div class="midia-fundo" data-fundo="convite"></div><div class="camada" data-camada="convite"></div></div>
    <div class="hero-texto">
      <h1 class="nome-script" data-titulo></h1>
      <p class="subtitulo" data-subtitulo></p>
      <div class="ornamento" aria-hidden="true"><i></i><b></b><i></i></div>
      <p class="data-evento" id="data-evento"></p>
    </div>
  </header>
  <p class="mensagem" id="mensagem"></p>
  <section class="contagem" id="contagem" aria-label="Contagem regressiva"></section>
  <section class="lista-inline" id="lista-inline"></section>
  <nav class="grade-botoes" id="grade-botoes" aria-label="Informações do convite"></nav>
  <footer class="rodape" id="rodape"></footer>
</main>

<button type="button" class="pilula" id="pilula"></button>

<!-- Painel que sobe com o conteúdo de cada botão -->
<div class="folha" id="folha" aria-hidden="true">
  <div class="folha-fundo" data-fechar></div>
  <section class="folha-cartao" role="dialog" aria-modal="true" aria-labelledby="folha-titulo">
    <button type="button" class="folha-fechar" data-fechar aria-label="Fechar"></button>
    <div class="folha-icone" id="folha-icone"></div>
    <h2 id="folha-titulo"></h2>
    <div class="folha-corpo" id="folha-corpo"></div>
  </section>
</div>

<div class="visor" id="visor" aria-hidden="true"><img alt=""><button type="button" data-fechar-visor aria-label="Fechar imagem"></button></div>
<div class="marca-dagua" id="marca-dagua" aria-hidden="true"></div>
<div class="efeitos" id="efeitos" aria-hidden="true"></div>

<button type="button" class="botao-som" id="botao-som" aria-label="Ligar ou desligar o som"></button>
<audio id="musica" loop preload="auto"></audio>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script src="js/store.js"></script>
<script src="js/convite.js"></script>
</body>
</html>
